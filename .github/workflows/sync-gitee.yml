name: Sync to Gitee
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push mirror to Gitee
        run: |
          git remote add gitee https://q-jade:${{ secrets.GITEE_TOKEN }}@gitee.com/q-jade/solar-system.git
          git push -f gitee main
