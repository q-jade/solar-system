<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="交互式 3D 太阳系互动百科 — 在浏览器中观察行星公转、查阅天体百科、探索天文知识">
  <meta property="og:title" content="3D 太阳系互动百科">
  <meta property="og:description" content="一个可探索的 3D 太阳系，在浏览器中漫游宇宙，学习天文知识。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://github.com/q-jade/solar-system">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title data-i18n="app.title">3D 太阳系</title>
</head>
<body>
  <!-- ── Loading screen ──────────────────────────── -->
  <div id="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div id="loading-text" >加载纹理中...</div>
      <div class="loading-bar-bg">
        <div id="loading-bar-fill" class="loading-bar-fill"></div>
      </div>
      <div id="loading-percent">0%</div>
    </div>
  </div>
  <div id="solar-system-container"></div>

  <!-- ── Help text (top-right) ──────────────── -->
  <div id="help-text"><span id="ctrl-hint">左键拖拽旋转 · 左键双击重置 · 滚轮缩放 · 右键单击行星聚焦</span></div>

  <!-- ── Top-right buttons ─────────────────── -->
  <div id="top-buttons">
    <button id="help-btn" title="帮助 / Help">ℹ️</button>
    <button id="global-quiz-btn" data-i18n="app.btnQuiz">❓ 知识挑战</button>
    <button id="quest-btn" data-i18n="app.btnQuest">📋 任务</button>
    <button id="ach-btn" data-i18n="app.btnAch">🏆 成就</button>
    <button id="stats-btn" data-i18n="app.btnStats">📊 我的档案</button>
  </div>

  <!-- ── Control panel overlay ──────────────── -->
  <div id="controls-panel">
    <!-- Row: scale -->
    <div class="ctrl-row">
      <div class="ctrl-label">
        <span class="ctrl-icon">🔍</span>
        <span data-i18n="control.scale">星体缩放</span>
      </div>
      <div class="ctrl-slider-row">
        <input type="range" id="scale-slider" min="0" max="100" value="0">
        <span id="scale-value" class="ctrl-value">x1</span>
      </div>
    </div>

    <!-- Row: speed -->
    <div class="ctrl-row">
      <div class="ctrl-label">
        <span class="ctrl-icon">⏱</span>
        <span data-i18n="control.speed">时间流速</span>
      </div>
      <div class="ctrl-slider-row">
        <input type="range" id="speed-slider" min="0" max="100" value="0">
        <span id="speed-value" class="ctrl-value">1×</span>
      </div>
    </div>

    <!-- Row: eccentricity -->
    <div class="ctrl-row">
      <div class="ctrl-label">
        <span class="ctrl-icon">📐</span>
        <span data-i18n="control.eccentricity">偏心率</span>
      </div>
      <div class="ctrl-slider-row">
        <input type="range" id="ecc-slider" min="0" max="40" value="10">
        <span id="ecc-value" class="ctrl-value">×1</span>
      </div>
    </div>

    <!-- Divider + toggles -->
    <div class="ctrl-divider"></div>
    <div class="ctrl-row ctrl-toggles">
      <label class="toggle-label">
        <input type="checkbox" id="labels-toggle" checked>
        <span class="toggle-track"></span>
        <span data-i18n="control.toggleLabels">名称</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="orbits-toggle" checked>
        <span class="toggle-track"></span>
        <span data-i18n="control.toggleOrbits">轨道</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="distance-toggle" checked>
        <span class="toggle-track"></span>
        <span data-i18n="control.toggleDist">距离</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="size-toggle" checked>
        <span class="toggle-track"></span>
        <span data-i18n="control.toggleSize">半径</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="ecliptic-toggle">
        <span class="toggle-track"></span>
        <span data-i18n="control.toggleEcliptic">黄道面</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="music-toggle" checked>
        <span class="toggle-track"></span>
        <span data-i18n="control.toggleMusic">🎵 音乐</span>
      </label>
      <label class="toggle-label" style="margin-top:6px;gap:4px;width:100%;">
        <span style="font-size:11px;color:#889;">🌐</span>
        <select class="lang-select" id="lang-select">
          <option value="zh-CN">中文</option>
          <option value="en-US">English</option>
        </select>
      </label>
    </div>
  </div>

  <!-- ── Version badge (bottom-right) ──── -->
  <div id="version-badge">v1.0.0</div>

  <!-- ── Distance info panel (bottom-left) ──── -->
  <div id="distance-panel">
    <div class="dp-title" data-i18n="control.orbitData">轨道数据</div>
    <div id="distance-list"></div>
  </div>

  <!-- ── Size comparison panel (bottom-right) ── -->
  <div id="size-panel">
    <div class="sp-title" data-i18n="control.radiusCompare">半径对比</div>
    <div id="size-list"></div>
  </div>
  <!-- ── Help panel ────────────────────────── -->
  <div id="help-overlay" style="display:none">
    <div id="help-panel">
      <button class="sp-close" id="help-close">✕</button>
      <div id="help-content"></div>
    </div>
  </div>

  <!-- ── Stats panel ────────────────────────── -->
  <div id="stats-overlay" style="display:none">
    <div id="stats-panel">
      <button class="sp-close" id="stats-close">✕</button>
      <div id="stats-content"></div>
    </div>
  </div>
</body>
</html>
