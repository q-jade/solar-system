<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 太阳系</title>
</head>
<body>
  <div id="solar-system-container"></div>

  <!-- ── Help text (top-right) ──────────────── -->
  <div id="help-text">左键拖拽旋转 · 滚轮缩放 · 双击重置</div>

  <!-- ── Control panel overlay ──────────────── -->
  <div id="controls-panel">
    <!-- Row: scale -->
    <div class="ctrl-row">
      <div class="ctrl-label">
        <span class="ctrl-icon">🔍</span>
        <span>星体缩放</span>
      </div>
      <div class="ctrl-slider-row">
        <input type="range" id="scale-slider" min="0" max="100" value="0">
        <span id="scale-value" class="ctrl-value">x1</span>
      </div>
    </div>

    <!-- Row: speed -->
    <div class="ctrl-row">
      <div class="ctrl-label">
        <span class="ctrl-icon">⏱</span>
        <span>时间流速</span>
      </div>
      <div class="ctrl-slider-row">
        <input type="range" id="speed-slider" min="0" max="100" value="0">
        <span id="speed-value" class="ctrl-value">1×</span>
      </div>
    </div>

    <!-- Row: eccentricity -->
    <div class="ctrl-row">
      <div class="ctrl-label">
        <span class="ctrl-icon">📐</span>
        <span>偏心率</span>
      </div>
      <div class="ctrl-slider-row">
        <input type="range" id="ecc-slider" min="0" max="40" value="10">
        <span id="ecc-value" class="ctrl-value">×1</span>
      </div>
    </div>

    <!-- Divider + toggles -->
    <div class="ctrl-divider"></div>
    <div class="ctrl-row ctrl-toggles">
      <label class="toggle-label">
        <input type="checkbox" id="labels-toggle" checked>
        <span class="toggle-track"></span>
        名称
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="orbits-toggle" checked>
        <span class="toggle-track"></span>
        轨道
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="distance-toggle" checked>
        <span class="toggle-track"></span>
        距离
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="size-toggle" checked>
        <span class="toggle-track"></span>
        半径
      </label>
    </div>
  </div>

  <!-- ── Distance info panel (bottom-left) ──── -->
  <div id="distance-panel">
    <div class="dp-title">轨道数据</div>
    <div id="distance-list"></div>
  </div>

  <!-- ── Size comparison panel (bottom-right) ── -->
  <div id="size-panel">
    <div class="sp-title">半径对比</div>
    <div id="size-list"></div>
  </div>
</body>
</html>
